<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importation by Month</title>
    <link href="../style.css" rel="stylesheet">
</head>
<body>
    <div class="mainContainer">
        <h1>Import Analysis</h1>
        <div class="kpiContainer">
            <div class="kpiCard">
                <span>Total Imports</span>
                <h2 id="totalUSD">
                    ---
                </h2>
            </div>
            <div class="kpiCard">
                <span>Trade Balance</span>
                <h2 id="tradeBalance">
                    ---
                </h2>
            </div>
            <div class="kpiCard">
                <span>Top Country</span>
                <h2 id="topCountry">
                    ---
                </h2>
            </div>
        </div>
        <div class="card">
            <div class="top_mode_country">
                <div class="modeSelector">
                    <h3>Analysis Type</h3>
                    <select id="chartMode">
                        <option value="month">
                            Monthly Analysis
                        </option>
                        <option value="ranking">
                            Top Countries
                        </option>
                    </select>
                </div>
                <div id="countrySection1" class="countrySelector">
                    <h3>Select a country</h3>
                    <input list="countries" id="country1" placeholder="Type a country">
                </div>
                <div id="countrySection2" class="countrySelector">
                    <h3>Select a country</h3>
                    <input list="countries" id="country2" placeholder="Type a country">
                </div>
                <div id="topSection" class="topSelector">
                    <h3>Top Ranking</h3>
                    <select id="topN">
                        <option value="5">Top 5</option>
                        <option value="10" selected>
                            Top 10
                        </option>
                        <option value="20">
                            Top 20
                        </option>
                        <option value="30">
                            Top 30
                        </option>
                    </select>
                </div>
                <div class="yearSelector">
                    <h3>Select years to compare</h3>
                    <label><input type="checkbox" value="2022"> 2022</label>
                    <label><input type="checkbox" value="2023"> 2023</label>
                    <label><input type="checkbox" value="2024"> 2024</label>
                    <label><input type="checkbox" value="2025"> 2025</label>
                    <label><input type="checkbox" value="2026" checked> 2026</label>
                    <datalist id="countries"></datalist>
                </div>
                <div>
                    <button class="filterContainer" id="updateChart">
                        Update Chart
                    </button>
                </div>
            </div>
            <div class="chartContainer">
                <canvas id="barChart"></canvas>
            </div>
        </div>
        <button class="backButton" onclick="history.back()">
            Back
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../operations/import/script.js"></script>
</body>
</html>
