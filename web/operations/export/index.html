<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportação Mensal</title>
    <link href="../../style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../../images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="../../images/favicon.ico">
    <link rel="apple-touch-icon" href="../../images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../images/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../images/favicon-512.png">
</head>

<body>
    <div class="mainContainer">
        <h1>Análise de Exportação</h1>
        <div class="kpiContainer">
            <div class="kpiCard">
                <span>Total de Exportações</span>
                <h2 id="totalUSD">
                    ---
                </h2>
            </div>
            <div class="kpiCard">
                <span>Balança Comercial</span>
                <h2 id="tradeBalance">
                    ---
                </h2>
            </div>
            <div class="kpiCard">
                <span>Principal País</span>
                <h2 id="topCountry">
                    ---
                </h2>
            </div>
        </div>
        <div class="card">
            <div class="top_mode_country">
                <div class="modeSelector">
                    <h3>Tipo de Análise</h3>
                    <select id="chartMode">
                        <option value="month">
                            Análise Mensal
                        </option>
                        <option value="ranking">
                            Ranking de Países
                        </option>
                    </select>
                </div>
                <div id="countrySection1" class="countrySelector">
                    <h3>Selecione um país</h3>
                    <input list="countries" id="country1" placeholder="Digite um país">
                </div>
                <div id="countrySection2" class="countrySelector">
                    <h3>Selecione um país</h3>
                    <input list="countries" id="country2" placeholder="Digite um país">
                </div>
                <div id="topSection" class="topSelector">
                    <h3>Ranking</h3>
                    <select id="topN">
                        <option value="5">Top 5</option>
                        <option value="10" selected>
                            Top 10
                        </option>
                        <option value="20">
                            Top 20
                        </option>
                        <option value="30">
                            Top 30
                        </option>
                    </select>
                </div>
                <div class="yearSelector">
                    <h3>Selecione os anos para comparar</h3>
                    <label><input type="checkbox" value="2022"> 2022</label>
                    <label><input type="checkbox" value="2023"> 2023</label>
                    <label><input type="checkbox" value="2024"> 2024</label>
                    <label><input type="checkbox" value="2025"> 2025</label>
                    <label><input type="checkbox" value="2026" checked> 2026</label>
                    <datalist id="countries"></datalist>
                </div>
                <div>
                    <button class="filterContainer" id="updateChart">
                        Atualizar Gráfico
                    </button>
                </div>
            </div>
            <div class="chartContainer">
                <canvas id="barChart"></canvas>
            </div>
        </div>
        <button class="backButton" onclick="history.back()">
            Voltar
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
